name: budget_expense_tracker
description: A budget and expense tracking application

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  uuid: ^3.0.7
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  sqflite: ^2.3.3
  path_provider: ^2.1.1
  intl: ^0.17.0
  csv: ^5.0.3
  fl_chart: ^0.65.0
  provider: ^6.1.1
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  permission_handler: ^12.0.0+1
  file_picker: ^10.1.2
  syncfusion_flutter_charts: ^21.2.4
  cupertino_icons: ^1.0.2
  path: ^1.8.3
  date_time_picker: ^2.1.0
  shimmer: ^3.0.0
  flutter_slidable: ^4.0.0
  percent_indicator: ^4.2.2
  currency_picker: ^2.0.15
  json_serializable: ^6.6.1
  flutter_animate: ^4.1.1+1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.0
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  generate: true

  assets:
    - web/icons/